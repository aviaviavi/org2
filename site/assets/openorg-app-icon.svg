<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#f8f6f1"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252c38"/>
      <stop offset="1" stop-color="#1d2430"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0868ff"/>
      <stop offset="1" stop-color="#0357ee"/>
    </linearGradient>
    <mask id="ring-opening">
      <rect width="1024" height="1024" fill="white"/>
      <rect x="408" y="608" width="208" height="300" fill="black"/>
    </mask>
  </defs>

  <!-- Transparent canvas outside the rounded app tile. -->
  <rect width="1024" height="1024" rx="205" fill="url(#tile)"/>

  <!-- The centered opening leaves equal negative space around the blue key. -->
  <path
    d="M 512 158
       A 354 354 0 1 1 511.99 158
       M 512 306
       A 206 206 0 1 0 512.01 306"
    fill="url(#ring)"
    fill-rule="evenodd"
    mask="url(#ring-opening)"
  />

  <path
    d="M 430 558
       H 594
       V 858
       Q 512 878 430 858
       Z"
    fill="url(#blue)"
  />
</svg>
