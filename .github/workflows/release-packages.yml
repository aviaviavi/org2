name: Release packages

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build/package only (skip publish steps)"
        required: false
        default: true
        type: boolean
      release_version:
        description: "SemVer version (e.g. 0.1.0) for workflow_dispatch"
        required: false
        default: "0.1.0-rc.1"
        type: string
      publish_only:
        description: "Retry publication from an existing version tag without rebuilding or retesting"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only && inputs.release_version || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve release version + mode
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.release_version }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            RAW="${GITHUB_REF_NAME}"
            VERSION="${RAW#v}"
            DRY_RUN="false"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Validate release secrets (publish mode)
        if: ${{ steps.version.outputs.dry_run != 'true' }}
        run: |
          test -n "$VSCE_PAT" || (echo "Missing secret: VSCE_PAT" && exit 1)

      - name: Install deps
        run: npm ci

      - name: Build + test once
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_only != true }}
        run: npm test

      - name: Stamp package versions
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm --prefix editors/vscode-org2 version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Pack npm package
        run: npm pack

      - name: Package VS Code extension (.vsix)
        run: |
          cd editors/vscode-org2
          npx @vscode/vsce package

      - name: Publish npm package (Trusted Publishing / OIDC)
        if: ${{ steps.version.outputs.dry_run != 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish_only != true) }}
        # The release commit passed the explicit test gate above. Publishing
        # the tarball with lifecycle scripts disabled prevents prepublishOnly
        # from running the full suite a second time.
        run: npm publish ./*.tgz --access public --provenance --ignore-scripts

      - name: Publish VS Code Marketplace extension
        id: vscode_publish
        continue-on-error: true
        if: ${{ steps.version.outputs.dry_run != 'true' }}
        run: |
          cd editors/vscode-org2
          npx @vscode/vsce publish --no-update-package-json --pat "$VSCE_PAT"

      - name: Report deferred VS Code Marketplace publication
        if: ${{ steps.version.outputs.dry_run != 'true' && steps.vscode_publish.outcome == 'failure' }}
        run: echo "::warning::VS Code Marketplace publication did not complete; continuing the release so it can be retried independently."

      - name: Publish Open VSX extension (optional)
        if: ${{ steps.version.outputs.dry_run != 'true' && env.OVSX_PAT != '' }}
        run: |
          cd editors/vscode-org2
          npx ovsx publish --no-update-package-json --pat "$OVSX_PAT"

      - name: Upload release artifacts
        if: ${{ steps.version.outputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          files: |
            *.tgz
            editors/vscode-org2/*.vsix
          generate_release_notes: true

      - name: Add Scarf Gateway download links to release notes
        if: ${{ steps.version.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/sync-release-downloads.mjs --release "${{ steps.version.outputs.version }}" --apply-release-notes

      - name: Upload dry-run artifacts
        if: ${{ steps.version.outputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ steps.version.outputs.version }}
          path: |
            *.tgz
            editors/vscode-org2/*.vsix
