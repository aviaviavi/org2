name: Spec fixtures

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  spec-v0-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate spec v0 fixtures
        run: node tools/fixture-runner.mjs
