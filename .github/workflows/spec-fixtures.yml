name: Spec fixtures

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  spec-v0-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Build reference parser
        run: npm run build
      - name: Validate spec v0 fixtures
        run: npm test

  ios-native-regressions:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Validate mobile search, JavaScriptCore bridge, and navigation
        run: node test/test-ios-mobile-navigation.mjs
