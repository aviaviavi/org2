name: OpenOrg macOS correctness and performance

on:
  pull_request:
    paths:
      - ".github/workflows/macos-performance.yml"
      - "apps/macos/Org2Workspace/**"
      - "src/**"
      - "test/fixtures/openorg-performance-*.json"
      - "test/fixtures/openorg-context-token-budgets-v1.json"
      - "test/test-openorg-context-token-budgets.mjs"
      - "test/test-openorg-performance-corpus.mjs"
      - "tools/openorg-performance-corpus.mjs"
      - "tools/test-macos-performance.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-performance.yml"
      - "apps/macos/Org2Workspace/**"
      - "src/**"
      - "test/fixtures/openorg-performance-*.json"
      - "test/fixtures/openorg-context-token-budgets-v1.json"
      - "test/test-openorg-context-token-budgets.mjs"
      - "test/test-openorg-performance-corpus.mjs"
      - "tools/openorg-performance-corpus.mjs"
      - "tools/test-macos-performance.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: openorg-macos-performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interaction-performance:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Report macOS build toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Install locked dependencies
        run: npm ci

      - name: Build shared Org2 runtime
        id: runtime
        run: npm run build

      - name: Enforce OpenOrg context token budget
        run: npm run benchmark:openorg-context

      - name: Run OpenOrg macOS correctness suite
        run: swift test --package-path apps/macos/Org2Workspace

      - name: Run release-mode OpenOrg performance regressions
        # A correctness failure must not leave performance unmeasured.
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: >-
          swift test --package-path apps/macos/Org2Workspace --configuration release
          --filter 'OpenOrgPerformanceGateTests|WorkspacePerformanceRegressionTests'
