name: OpenOrg macOS performance

on:
  pull_request:
    paths:
      - ".github/workflows/macos-performance.yml"
      - "apps/macos/Org2Workspace/**"
      - "src/**"
      - "test/fixtures/openorg-performance-*.json"
      - "test/test-openorg-performance-corpus.mjs"
      - "tools/openorg-performance-corpus.mjs"
      - "tools/test-macos-performance.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/macos-performance.yml"
      - "apps/macos/Org2Workspace/**"
      - "src/**"
      - "test/fixtures/openorg-performance-*.json"
      - "test/test-openorg-performance-corpus.mjs"
      - "tools/openorg-performance-corpus.mjs"
      - "tools/test-macos-performance.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: openorg-macos-performance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interaction-performance:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build shared Org2 runtime
        run: npm run build

      - name: Run OpenOrg macOS correctness suite
        run: swift test --package-path apps/macos/Org2Workspace

      - name: Run release-mode OpenOrg interaction gate
        run: npm run test:macos-performance
        env:
          OPENORG_PERFORMANCE_ARTIFACT_DIR: ${{ runner.temp }}/openorg-performance

      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openorg-performance-${{ github.sha }}
          path: ${{ runner.temp }}/openorg-performance
          if-no-files-found: warn
          retention-days: 30
